  <script>
    // Early perf-mode: detect Android BEFORE first paint to prevent
    // the initial render from being a 5-FPS slideshow.
    (function(){
      var ua = (navigator.userAgent||"").toLowerCase();
      var touch = (navigator.maxTouchPoints||0) > 0 && window.matchMedia("(pointer:coarse)").matches;
      if (touch || /android|iphone|ipad|ipod|mobile/.test(ua)) {
        document.documentElement.classList.add("perf-mode");
        document.documentElement.classList.add("mobile-ui");
        window.__perfMode = true;
      }
    })();
  </script>
